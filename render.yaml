databases:
  - name: linear-algebra-db
    databaseName: linearalgebradb
    user: linearalgebrauser
    plan: free

services:
  - type: web
    name: linear-algebra-solver
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn algebrify.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: linear-algebra-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.0"
