{% extends 'base.html' %}

{% block title %}Set New Password – Algebrify{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-custom p-4 p-md-5">
                <h3 class="fw-bold mb-3 text-center">Set New Password</h3>
                <form method="POST">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3">
                            <label for="{{ field.id_for_label }}" class="form-label fw-semibold">{{ field.label }}</label>
                            <input type="password" name="{{ field.name }}" class="form-control" id="{{ field.id_for_label }}" required>
                            {% for error in field.errors %}
                                <div class="text-danger small mt-1">{{ error }}</div>
                            {% endfor %}
                        </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-bold">Set Password</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
