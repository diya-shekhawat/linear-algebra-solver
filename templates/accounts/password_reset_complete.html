{% extends 'base.html' %}

{% block title %}Password Reset Complete – Algebrify{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="card card-custom p-5 max-w-md mx-auto">
        <i class="bi bi-shield-check text-primary fs-1 mb-3"></i>
        <h3 class="fw-bold">Password Reset Complete</h3>
        <p class="text-muted">Your password has been set. You can now log in with your new credentials.</p>
        <a href="{% url 'accounts:login' %}" class="btn btn-primary rounded-pill px-4 mt-3">Log In Now</a>
    </div>
</div>
{% endblock %}
