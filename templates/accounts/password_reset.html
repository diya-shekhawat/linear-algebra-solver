{% extends 'base.html' %}

{% block title %}Reset Password – Algebrify{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-custom p-4 p-md-5">
                <div class="text-center mb-4">
                    <h3 class="fw-bold">Reset Password</h3>
                    <p class="text-muted small">Enter your email address and we'll send you instructions to reset your password.</p>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_email" class="form-label fw-semibold">Email Address</label>
                        <input type="email" name="email" class="form-control" id="id_email" required placeholder="name@example.com">
                    </div>

                    <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-bold">
                        Send Reset Link
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
