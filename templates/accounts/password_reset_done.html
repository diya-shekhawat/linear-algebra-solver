{% extends 'base.html' %}

{% block title %}Email Sent – Algebrify{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="card card-custom p-5 max-w-md mx-auto">
        <i class="bi bi-envelope-check-fill text-success fs-1 mb-3"></i>
        <h3 class="fw-bold">Check Your Email</h3>
        <p class="text-muted">We've emailed you instructions for setting your password. If an account exists with the email you entered, you should receive them shortly.</p>
        <a href="{% url 'accounts:login' %}" class="btn btn-outline-primary rounded-pill px-4 mt-3">Return to Login</a>
    </div>
</div>
{% endblock %}
