{% extends 'base.html' %}

{% block title %}Change Password – Algebrify{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-custom p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="bg-primary text-white rounded-circle p-3 mx-auto mb-3 d-flex align-items-center justify-content-center" style="width:60px; height:60px;">
                        <i class="bi bi-shield-lock-fill fs-3"></i>
                    </div>
                    <h3 class="fw-bold">Change Password</h3>
                    <p class="text-muted small">Update your account password securely.</p>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3">
                            <label for="{{ field.id_for_label }}" class="form-label fw-semibold">{{ field.label }}</label>
                            <input type="{{ field.field.widget.input_type|default:'password' }}" name="{{ field.name }}" class="form-control" id="{{ field.id_for_label }}" required>
                            {% for error in field.errors %}
                                <div class="text-danger small mt-1">{{ error }}</div>
                            {% endfor %}
                        </div>
                    {% endfor %}

                    <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-bold shadow-sm">
                        <i class="bi bi-key-fill me-2"></i> Update Password
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
