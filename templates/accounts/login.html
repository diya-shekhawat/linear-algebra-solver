{% extends 'base.html' %}

{% block title %}Login – Algebrify Portal{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-custom p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="bg-primary text-white rounded-circle p-3 mx-auto mb-3 d-flex align-items-center justify-content-center" style="width:60px; height:60px;">
                        <i class="bi bi-box-arrow-in-right fs-3"></i>
                    </div>
                    <h3 class="fw-bold">Welcome Back!</h3>
                    <p class="text-muted small">Log in to track your streak, bookmarks, and quiz progress.</p>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_username" class="form-label fw-semibold">Username</label>
                        <input type="text" name="username" class="form-control" id="id_username" required placeholder="Enter your username">
                    </div>
                    <div class="mb-3">
                        <div class="d-flex justify-content-between align-items-center">
                            <label for="id_password" class="form-label fw-semibold">Password</label>
                            <a href="{% url 'accounts:password_reset' %}" class="small text-decoration-none text-primary">Forgot Password?</a>
                        </div>
                        <input type="password" name="password" class="form-control" id="id_password" required placeholder="Enter your password">
                    </div>

                    <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-bold shadow-sm">
                        <i class="bi bi-box-arrow-in-right me-2"></i> Log In
                    </button>
                </form>

                <hr class="my-4 border-secondary opacity-25">

                <div class="text-center small">
                    <span class="text-muted">Don't have an account yet?</span>
                    <a href="{% url 'accounts:register' %}" class="fw-bold text-decoration-none text-primary ms-1">Register Now</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
